steps:
  # Build Backend image (used by both ingestion-api and agent-api)
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - docker/Dockerfile.backend
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest
      - .

  # Build Frontend SPA + Nginx image in parallel
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - docker/Dockerfile.frontend
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest

substitutions:
  _REGION: us-central1
  _REPO_NAME: interactive-rag-repo
  _IMAGE_TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
